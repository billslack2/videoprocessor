# VP-0028 minimal target-design example -- NOT YET SAFE TO DEPLOY.
#
# This deliberately small example exercises independent automatic input and
# scaling groups plus manual display and viewport groups. It omits LUTs and
# event actions so the core resolver behavior is easy to review.

[display]
sdr_target_nits=100
sdr_black_nits=0
quality=high
tone_mapping=spline
gamut_mapping=perceptual
peak_detection=DEFAULT
contrast_recovery=AUTO
upscaler=AUTO
downscaler=AUTO
deband_strength=DEFAULT
dithering=AUTO
output_presentation=DIRECT
output_range=FULL
output_gamma=AUTO
sdr_target_primaries=REC709
report_bt2020_to_display=false

[general]
# config_version is optional; omitted means the latest supported unified schema.
persist_profile_selection=true
switch_refresh_rate=true
event_action_delay_seconds=5
output_diagnostics=OFF
diagnostic_disable_shader_cache=OFF

[profile_groups.input]
profiles=sdr,pq,hlg
default=auto
when=$key=="Ctrl+F4"
persist_profile_selection=false

[profile_groups.scaling]
profiles=hd,uhd
default=auto
persist_profile_selection=false

[profile_groups.display]
profiles=rec709,bt2020
default=rec709

[profile_groups.viewport]
profiles=normal,scope
default=normal

[profiles.input.sdr]
when=$transfer==SDR
priority=100
peak_detection=off

[profiles.input.pq]
when=$transfer==PQ
priority=100
tone_mapping=spline
gamut_mapping=perceptual
peak_detection=high_quality
contrast_recovery=0.25

[profiles.input.hlg]
when=$transfer==HLG
priority=100
tone_mapping=spline
gamut_mapping=perceptual
peak_detection=high_quality
contrast_recovery=0.25

[profiles.scaling.hd]
when=$height<2160
priority=100
upscaler=ewa_lanczossharp

[profiles.scaling.uhd]
when=$height>=2160
priority=100
upscaler=AUTO

[profiles.display.rec709]
when=$key=="F5"
sdr_target_primaries=REC709
report_bt2020_to_display=false

[profiles.display.bt2020]
when=$key=="F6"
sdr_target_primaries=BT2020
report_bt2020_to_display=true

[profiles.viewport.normal]
when=$key=="F2"
mode=normal

[profiles.viewport.scope]
when=$key=="F3"
mode=scope
scope_screen_aspect=2.35:1
scope_subtitle_fit=true
scope_subtitle_hold_seconds=2
scope_subtitle_padding_pixels=30
