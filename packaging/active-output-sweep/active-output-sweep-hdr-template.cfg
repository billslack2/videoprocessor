# Dedicated HDR tone-map baseline. The suite validates each transport contract
# and changes only the documented target/mapping dimension per comparison.
[vprenderer]
output_path_profile: custom
output_presentation: direct
output_range: full
output_gamma: 2.2
diagnostic_allow_full_g22: true
diagnostic_allow_limited_g22: false
diagnostic_vp_owned_dxgi_presenter: true
diagnostic_force_8bit_sdr_swapchain: false
diagnostic_disable_compute: false
diagnostic_disable_shader_cache: false
output_diagnostics: true
sdr_target_nits: 100
sdr_black_nits: AUTO
tone_mapping: AUTO
gamut_mapping: AUTO
peak_detection: AUTO
contrast_recovery: AUTO
sdr_target_primaries: bt2020
report_bt2020_to_display: true

[general]
renderer: VP Renderer
