# VideoProcessor release sample configuration
#
# This file is read at startup from the same directory as VideoProcessor.exe.
# Leave a setting commented out unless it is appropriate for your hardware.

[general]
present_every_vsync: false
presentation_queue_depth: 3
stats_osd_size_percent: 150
scale_osd: true
# The portable internal baseline starts visibly on the first Quad HDMI input
# with VP Renderer. Change either value in Config for different hardware.
# Optional connection type for devices that expose more than one connection.
# A Quad HDMI channel normally supports only HDMI, so this may stay omitted.
#capture_input: HDMI
renderer: VP Renderer
# Hide legacy DirectShow renderer registrations from the Windows system folders.
hide_legacy_renderers: true
fullscreen: true
windowed_fullscreen_mode: false
noui: false
startminimized: true
#fullscreen_monitor_name: <Windows monitor friendly name>
#fullscreen_monitor_session_mode: target-only
scene_detect: false
hdr_colorspace: FOLLOW_INPUT_LLDV
hdr_luminance: FOLLOW_INPUT_LLDV
# Opt in when the capture path reports LLDV as stabilized BT.2020 + SDR.
#newlldv: true

# The first profile in each group is the default. Alternate profiles remain
# available in Config but ship without keyboard shortcuts, rules, or actions.

# Optional host-memory packing requested from DeckLink for detected RGB input.
# AUTO preserves the established ARGB/r210/R12B defaults. The active device and
# mode are checked; unsupported alternatives fall back safely and are logged.
video_conversion: V210_TO_P010
switch_refresh_rate: always
newlldv: false
profile_change_display_seconds: 7
capture_device: DeckLink Quad HDMI Recorder (2)
[decklink]
rgb_8bit_packing: AUTO
rgb_10bit_packing: AUTO
rgb_12bit_packing: AUTO

[queue.Should_Never_Be_Active]
queue_size: 32
lead_frames: 4
startup_preroll_frames: 0
target_frames: 3
#active_picture_lookahead_frames: 0
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 70

active_picture_lookahead_frames: 0
reset_after_render_restart_seconds: 5
reset_queue_too_large_percent: 75
[queue.MadVR_Queue]
shortcut: Shift+M
when: ${renderer}=="DirectShow - madVR"
reset_after_render_restart_seconds: 5
lead_frames: 4
startup_preroll_frames: 4
queue_size: 32
target_frames: 3
active_picture_lookahead_frames: 4
reset_queue_too_large_percent: 75
[queue.VP_60]
queue_size: 16
lead_frames: 8
startup_preroll_frames: 8
target_frames: 9
active_picture_lookahead_frames: 5
reset_after_render_restart_seconds: 5
reset_queue_too_large_percent: 75
when: ${renderer} ~= "VP Renderer" && ${source_rate} > 51
[queue.VP_50]
when: ${renderer} ~= "VP Renderer" && ${source_rate} > 30
queue_size: 16
lead_frames: 8
startup_preroll_frames: 8
target_frames: 9
active_picture_lookahead_frames: 5
[queue.VP_24]
when: ${renderer} ~= "VP Renderer" && ${source_rate} <= 30
queue_size: 10
lead_frames: 4
startup_preroll_frames: 4
target_frames: 4
active_picture_lookahead_frames: 3
reset_after_render_restart_seconds: 5
reset_queue_too_large_percent: 75
[queue.Low_Latency]
queue_size: 1
lead_frames: 0
startup_preroll_frames: 0
target_frames: 1
#active_picture_lookahead_frames: 0
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 75

reset_queue_too_large_percent: 75
shortcut: Shift+L
active_picture_lookahead_frames: 0
reset_after_render_restart_seconds: 5

[directshow]
renderer_start_stop_time_method: CLOCK_SMART2
frame_offset: 90
renderer_nominal_range: AUTO


[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 1
chroma_downsampling: ADVANCED

[directshow.ppm]
ppm: AUTO

[lldv.Default]
dolby_vision_tunnel: true
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

# VP Renderer baseline. AUTO retains the selected quality
# preset's resolver value. Calibration choices must match the actual display
# path; do not use another system's calibrated values blindly.
mastering_min_luminance: 0.001
mastering_max_luminance: 10000
max_fall: 400
[legacy_output.default]
output_presentation: direct
output_range: full

output_path_profile: custom
diagnostic_allow_limited_g22: false
diagnostic_disable_compute: false
diagnostic_force_8bit_sdr_swapchain: false
diagnostic_vp_owned_dxgi_presenter: false
output_diagnostics: false
diagnostic_disable_shader_cache: false
output_transport_gamma: 2.2
[vprenderer.viewport.viewport_16x9]
label: 16x9

# NLS is off by default. Named shader profiles remain available in Config.
# Both bundled implementations must remain in the executable's shaders directory.
screen_aspect: 16:9
# Resting placement when a fitted picture leaves vertical space. Subtitle fit
# may still shift the HDMI picture temporarily for top or bottom subtitles.
vertical_alignment: center

# Optional scope presentation. It is deliberately unbound: select it in Config
# after matching it to the physical screen or masking aperture.
shortcut: F3
[vprenderer.viewport.scope]
