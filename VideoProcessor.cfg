# VideoProcessor.cfg — VP-0079 single-file configuration
#
# The root section is the baseline. A named child is an overlay selected by
# its when expression. Key selections last for this process only; they are
# cleared by selecting that root's when expression and never written to disk.

[general]
capture_device: Decklink Quad HDMI Recorder (2)
renderer: DirectShow - madVR
#renderer: VideoProcessor Renderer (Alpha)
fullscreen: true
windowed_fullscreen_mode: true
startminimized: true
scene_detect: true
disable_detection_features: false
scene_correction_basic: false
hdr_colorspace: FOLLOW_INPUT_LLDV
hdr_luminance: FOLLOW_INPUT_LLDV

# Renderer aliases name the startup renderer-combo index. They make shortcuts
# portable across the configured renderer order without owning settings.
[renderer_alias]
vp: 1
madvr: 2

# l returns the queue to this baseline; L selects the low-latency overlay.
# A one-frame queue is intentionally opt-in because it will reset frequently
# if the renderer cannot keep up.
[queue]
when: $key=="l"
queue_size: 32
lead_frames: 4
target_frames: 3
# VP-0082 diagnostic preview control. Alpha analyzes existing queued frames and
# logs decisions, but does not change pixels yet; leave disabled for viewing.
#active_picture_lookahead_frames: 0

[queue.low_latency]
when: $key=="L"
queue_size: 1
target_frames: 1

# Optional renderer-recovery safeguards; these retain the current defaults.
[queue_recovery]
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 70

[shortcuts]
render.1: A
render.2: M

[directshow]
video_conversion: V210_TO_P010
renderer_start_stop_time_method: RATIONAL_RATIONAL
frame_offset: 90
renderer_nominal_range: AUTO

[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 2

# One PPM correction applies to source timing at every cadence.
[directshow.ppm]
ppm: AUTO

[lldv]
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

[logging]
#debug_log_retention: 10

# VideoProcessor Renderer (Alpha) only. The first named section is the startup
# baseline. Later variants inherit it and override only their own values.
# AUTO leaves the bundled renderer's normal resolver in control; it does not
# select an arbitrary upstream libplacebo option.
[vprenderer.rec709]
when: $key=="F4"
sdr_target_nits: 100
sdr_black_nits: 0
quality: high
# Tone/gamut choices control HDR-to-target color mapping. AUTO is conservative;
# spline plus perceptual is an explicit SDR-projector starting point.
tone_mapping: spline
gamut_mapping: perceptual
peak_detection: AUTO
contrast_recovery: AUTO
# These filters matter only when Alpha actually rescales. AUTO keeps renderer
# defaults; deband/dithering are separate final-image cleanup decisions.
upscaler: AUTO
downscaler: AUTO
deband: AUTO
dithering: AUTO
# Output range/gamma/primaries must match the display calibration path. They
# are output properties, not source metadata overrides.
output_presentation: DIRECT
output_range: FULL
output_gamma: AUTO
sdr_input_transfer: AUTO
sdr_target_primaries: REC709
report_bt2020_to_display: false
switch_refresh_rate: true

[vprenderer.bt2020]
when: $key=="F5"
sdr_target_primaries: BT2020
report_bt2020_to_display: true

# Viewport is Alpha-only. F3 is its empty 16:9 baseline; F2 selects scope.
# screen_aspect names the target screen, while anamorphic_scale applies only a
# final horizontal presentation correction. Neither changes color processing.
[vprenderer.viewport]
when: $key=="F3"

[vprenderer.viewport.scope]
when: $key=="F2"
screen_aspect: 2.35:1
automatic_crop: true
subtitle_fit: true
subtitle_hold_seconds: 2
subtitle_padding_pixels: 30

[vprenderer.viewport.scope_anamorphic]
when: $key=="F8"
screen_aspect: 2.35:1
anamorphic_scale: 16:15
automatic_crop: true
subtitle_fit: true
subtitle_hold_seconds: 2
subtitle_padding_pixels: 30

# type: single is the default. n selects this empty root (NLS off);
# Shift+n and Shift+p select one child. The appropriate backend file is used
# and a missing file for a backend is ignored.
[shader.nls]
when: $key=="n"

[shader.nls.standard]
when: $key=="Shift+n"
shader_type: nls
label: Nonlinear Stretch
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: classic
strength: 1.0
curve: 2.0
tolerance_percent: 5

[shader.nls.protected]
when: $key=="Shift+p"
shader_type: nls
label: Nonlinear Stretch Protected
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: protected
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5

# A multi group composes every child matching D. d selects its empty root.
[shader.cleanup]
type: multi
when: $key=="d"

[shader.cleanup.deband]
when: $key=="D"
shader_type: custom
label: Mild Debanding
stage: pre_resize
order: 30
hlsl_file: Debanding mild.hlsl

[shader.cleanup.denoise]
when: $key=="D"
shader_type: custom
label: Light Denoise
stage: pre_resize
order: 40
hlsl_file: Denoise.hlsl

[shader.cleanup.sharpen]
when: $key=="D"
shader_type: custom
label: Adaptive Sharpen
stage: post_resize
order: 10
hlsl_file: Adaptive sharpen.hlsl

# Automatic groups compose independently with manual shader groups.
[shader.broadcast_sdr]
when: $transfer=="SDR" && ($source_rate==59 || $source_rate==60)
shader_type: custom
label: Broadcast SDR cleanup
stage: pre_resize
order: 50
hlsl_file: Debanding mild.hlsl

[actions.audio_delay_film]
on: refresh.applied,refresh.confirmed
when: $actual_refresh<=30
run: C:\Videoprocessor\audio\audio_delay.bat 100

[actions.audio_delay_video]
on: refresh.applied,refresh.confirmed
when: $actual_refresh>=50
run: C:\Videoprocessor\audio\audio_delay.bat 65
