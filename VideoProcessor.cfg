# Unified VideoProcessor configuration
#
# This file is read from the working directory.
# Command-line switches override matching values in this file.

[command_line]
capture_device=Decklink Quad HDMI Recorder (2)
fullscreen=true
renderer=DirectShow - madVR
video_conversion=V210_TO_P010
# container_colorspace=BT2020
hdr_colorspace=FOLLOW_INPUT_LLDV
hdr_luminance=FOLLOW_INPUT_LLDV
renderer_start_stop_time_method=RATIONAL_RATIONAL
queue_size=32
scene_detect=true
renderer_nominal_range=LIMITED
startminimized=true
frame_offset=90
# windowedfullscreenmode=true
noui=false
# renderer_transfer_function=AUTO
# renderer_transfer_matrix=AUTO
# renderer_primaries=AUTO

[p010_conversion]
# ConversionMethod: AUTO, SIMD, OPTIMIZED, STANDARD
# MinCoreCount: minimum cores (1+)
# MaxCoreCount: maximum cores (0=auto)
ConversionMethod=SIMD
MinCoreCount=1
MaxCoreCount=1

[ppm_correction]
# Format: refresh_rate=ppm_value
#
# Use the truncated refresh rate as the key.
# Examples:
#   59.94 Hz -> key "59"
#   29.97 Hz -> key "29"
#   23.976 Hz -> key "23"
#
# Positive PPM values make the stream faster.
# Negative PPM values make the stream slower.
# AUTO enables automatic calibration.
59=5
29=5
50=5
25=2
24=0
23=0
