# Unified VideoProcessor configuration
#
# This file is searched first beside the executable; the working directory is a fallback.
# Command-line values override matching values in this file.
# Config entries must use key=value. Boolean values accept true/false, yes/no,
# on/off, or 1/0. On the command line, a bare Boolean switch enables it.
# Keys and option values, including device and renderer names, are case-insensitive.

[command_line]
capture_device=Decklink Quad HDMI Recorder (1)
#fullscreen=true
renderer=DirectShow - madVR
#video_conversion=V210_TO_P010
#container_colorspace=BT2020
#hdr_colorspace=FOLLOW_INPUT_LLDV
#hdr_luminance=FOLLOW_INPUT_LLDV
#renderer_start_stop_time_method=CLOCK_SMART
queue_size=32
scene_detect=false
scene_correction_mode=BASIC
# Treat stable BT.2020 + SDR input without HDR metadata as LLDV and synthesize PQ/HDR metadata.
# This is heuristic-only because DeckLink does not expose HDMI VSIF. Keep false for legacy behavior.
#newlldv=false
#renderer_nominal_range=LIMITED
#startminimized=true
#frame_offset=90
# windowedfullscreenmode=true
#noui=false
# renderer_transfer_function=AUTO
# renderer_transfer_matrix=AUTO
# renderer_primaries=AUTO
