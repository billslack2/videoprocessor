# VideoProcessor sample configuration
#
# Place this file beside VideoProcessor.exe. Command-line values override these
# settings. Entries use key=value; names and values are case-insensitive.

[command_line]
#capture_device=Decklink Quad HDMI Recorder (1)
renderer=
queue_size=32

#fullscreen=true
#windowedfullscreenmode=true
#startminimized=true
#noui=false
#frame_offset=90
#video_conversion=V210_TO_P010

# Optional synthetic HDR metadata for classic LLDV and newlldv. Uncomment only
# the values you want to override; omitted keys retain each mode's defaults.
[lldv]
#max_cll=1000
#max_fall=401
#mastering_min_luminance=0.001
#mastering_max_luminance=4000

[queue_recovery]
# Defaults shown here explicitly: wait 5 seconds, then recover if either queue
# reaches 75 percent of its own capacity.
reset_after_render_restart_seconds=5
reset_queue_too_large_percent=75

# Keyboard shortcuts. Modifier names are case-insensitive. Lowercase letters
# are unmodified; uppercase letters imply Shift (v=V, V=Shift+V).
[shortcuts]
auto_set=Ctrl+Shift+a
fullscreen_exit=Escape
fullscreen_toggle=Alt+Enter
toggle_stats_overlay=Ctrl+i
pq_set=Ctrl+Shift+p
renderer_restart=Shift+r
renderer_reset=r
capture_1=Ctrl+1
capture_2=Ctrl+2
capture_3=Ctrl+3
capture_4=Ctrl+4
video_conversion_off=v
video_conversion_p010=V

# Optional exact display-rate overrides, keyed by nominal input refresh rate.
# An active override is marked with * in the OSD.
[display_refresh_rate_override]
#23=23.976024
#29=29.970030
#59=59.940060
#23=AUTO

# Optional renderer-native Direct3D 9 HLSL shader rules. Rules are checked from
# left to right; the first signal/rate match wins. Relative paths are resolved
# from this configuration file. Numbered entries run in order within a stage.
[shaders]
enabled=true
rules=nls,nls_off
default=none
#fallback_shader_model=ps_3_0

# Manual rules are never selected automatically. Their shortcuts switch the
# complete VP-managed shader chain while video is running. Uppercase N means
# Shift+N; lowercase n has no Shift modifier.
[shaders.nls]
label=Nonlinear Stretch
manual=true
shortcut=N
output_aspect_ratio=2.35
# Keep NLS armed but bypass it until a stable P010 active-picture estimate is
# at least 5% narrower than the scope target. Reject 4:3 material.
aspect_tolerance_percent=5
aspect_direction=narrower_only
active_aspect_min=1.70
inactive_rule=nls_off
pre_resize_1=Shaders\NLS.hlsl
param_strength=1.0
# Geometry: classic (SickGreg/SuperView-style) or protected (steadier centre).
param_geometry=protected
# Fraction of picture width protected in protected mode (0.35 = central 35%).
param_center_protection=0.35
param_curve=2.0
param_stretch_ratio=1.321875
param_quality=medium

[shaders.nls_off]
label=NLS Off
manual=true
shortcut=n
output_aspect_ratio=native
none=true
