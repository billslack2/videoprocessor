# VideoProcessor release sample configuration
#
# This file is read at startup from the same directory as VideoProcessor.exe.
# Leave a setting commented out unless it is appropriate for your hardware.

[general]
# Select capture device and renderer in the UI, or uncomment either setting
# below and replace the value with an exact locally available name.
#capture_device: <capture device name>
# Optional connection type for devices that expose more than one connection.
# A Quad HDMI channel normally supports only HDMI, so this may stay omitted.
#capture_input: HDMI
#renderer: VP Renderer
# Hide legacy DirectShow renderer registrations from the Windows system folders.
hide_legacy_renderers: true
#fullscreen: true
#windowed_fullscreen_mode: true
#fullscreen_monitor_name: <Windows monitor friendly name>
#fullscreen_monitor_session_mode: target-only
scene_detect: true
video_conversion: V210_TO_P010
hdr_colorspace: FOLLOW_INPUT_LLDV
hdr_luminance: FOLLOW_INPUT_LLDV
# Opt in when the capture path reports LLDV as stabilized BT.2020 + SDR.
#newlldv: true

# Press l for this normal-latency baseline. Press L for the low-latency mode.
# A one-frame queue is intentionally opt-in because it has less timing headroom.
capture_device: DeckLink Quad HDMI Recorder (2)
fullscreen_monitor_name: EPSON PJ
newlldv: false
startminimized: true
windowed_fullscreen_mode: true
fullscreen: true

[shortcuts]
# Toggle between the normal controls and the windowed video-only layout.
#toggle_noui: Ctrl+Shift+U

# Optional host-memory packing requested from DeckLink for detected RGB input.
# AUTO preserves the established ARGB/r210/R12B defaults. The active device and
# mode are checked; unsupported alternatives fall back safely and are logged.
[decklink]
rgb_8bit_packing: AUTO
rgb_10bit_packing: AUTO
rgb_12bit_packing: AUTO

[queue.Normal]
shortcut: l
queue_size: 32
lead_frames: 4
startup_preroll_frames: 0
target_frames: 3
#active_picture_lookahead_frames: 0
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 70

[queue.Low_Latency]
shortcut: Shift+l
queue_size: 1
lead_frames: 1
startup_preroll_frames: 0
target_frames: 1
#active_picture_lookahead_frames: 0
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 75

reset_queue_too_large_percent: 200
[directshow]
renderer_start_stop_time_method: CLOCK_SMART
frame_offset: AUTO
renderer_nominal_range: AUTO

[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 2

[directshow.ppm]
ppm: AUTO

[lldv.default]
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

# Optional later profiles inherit blank values from the first profile. A
# shortcut or when rule can select them; file order decides rule precedence.
#[lldv.bright]
#shortcut: Shift+d
#max_cll: 4000

[logging]
#debug_log_retention: 10

# VP Renderer baseline. AUTO retains the selected quality
# preset's resolver value. Output range and calibration choices must match the
# actual display path; do not use another system's calibrated values blindly.
[vprenderer.rec709]
shortcut: F4
sdr_target_primaries: REC709
report_bt2020_to_display: false

switch_refresh_rate: true
[vprenderer.bt2020]
shortcut: F5
sdr_target_primaries: BT2020
report_bt2020_to_display: true

# The root is the default screen configuration. screen_aspect accepts a ratio
# (2.1:1), decimal (2.1), or dimensions (2100x1000), and drives presentation,
# crop/subtitle policy, and NLS. Named screen profiles can override it.
[vprenderer.viewport]

# NLS is off by default. Press Shift+N for Classic, Shift+P for Protected,
# or n to return to the off state. Both bundled shader implementations must
# remain in the executable's shaders directory.
subtitle_fit: true
screen_aspect: 2.35:1
# Resting placement when a fitted picture leaves vertical space. Subtitle fit
# may still shift the HDMI picture temporarily for top or bottom subtitles.
vertical_alignment: center
shortcut: F3
subtitle_engage_drift_ms: 0
subtitle_release_drift_ms: 2000
subtitle_padding_pixels: 35
subtitle_target_buffer_pixels: 10
automatic_crop: true
[shader.nls]
shortcut: n

[shader.nls.standard]
shortcut: Shift+n
shader_type: nls
label: Nonlinear Stretch
stage: post_resize
order: 7
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: classic
strength: 1.0
curve: 2.0
tolerance_percent: 5
max_stretch_ratio: 1.4
aspect_direction: narrower_only

[shader.nls.protected]
shortcut: Shift+p
shader_type: nls
label: Nonlinear Stretch Protected
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: protected
max_stretch_ratio: 1.4
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5
aspect_direction: narrower_only
