# VideoProcessor single-file sample configuration
#
# Place this file beside VideoProcessor.exe. It contains application, capture,
# shader, built-in renderer, profile, hotkey, and event-action settings.
# Command-line values override these settings. Entries use key: value; names
# and values are case-insensitive.

[command_line]
#capture_device: Decklink Quad HDMI Recorder (1)
renderer:
queue_size: 32
# DirectShow renderer input metadata. AUTO lets the selected renderer infer the
# source nominal range; this is not the HDMI/display output range.
renderer_nominal_range: AUTO

#fullscreen: true
#windowedfullscreenmode: true
#startminimized: true
#noui: false
#frame_offset: 90
#video_conversion: V210_TO_P010

# VP queue policy is expressed only in frames.  These are VP's converted-frame
# thresholds, not a madVR setting or an observation of madVR's private queues.
# Omit a value to keep its automatic policy. Startup zero also remains AUTO;
# an explicit steady zero is a literal zero-frame target. Values are limited
# to 0 through 16 and bounded by the active VP queue capacity.
[queue]
#startup_preroll_frames: 0
#steady_reserve_frames: 0

# DirectShow sample scheduling margin, expressed in source frames. Omit this
# setting to preserve the legacy per-mode behavior (180ms for most timestamp
# modes and zero for Clock-Rational). Explicit zero is allowed.
[directshow]
#presentation_lead_frames: 1

# Optional synthetic HDR metadata for classic LLDV and newlldv. Uncomment only
# the values you want to override; omitted keys retain each mode's defaults.
[lldv]
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

# Debug logs use logs\vp_debug.log beneath the main executable directory. VP
# does not create that directory or write a fallback log when it is missing.
# Retention is resolved once at process startup and includes the active log.
# Omitted, invalid, zero, duplicate, or out-of-range values use the safe
# default of 10; accepted values are 1 through 100.
[logging]
#debug_log_retention: 10  # total files: active vp_debug.log plus indexed .0 (newest), .1, ...

[queue_recovery]
# Defaults shown here explicitly: wait 5 seconds, then recover if either queue
# reaches 75 percent of its own capacity.
reset_after_render_restart_seconds: 5
reset_queue_too_large_percent: 75

# Keyboard shortcuts. Modifier names are case-insensitive. Lowercase letters
# are unmodified; uppercase letters imply Shift (v=V, V=Shift+V).
[shortcuts]
auto_set: Ctrl+Shift+a
fullscreen_exit: Escape
fullscreen_toggle: Alt+Enter
toggle_stats_overlay: Ctrl+i
pq_set: Ctrl+Shift+p
renderer_restart: Shift+r
renderer_reset: r
# Select the 1-based renderer-combo entry. The order is logged at startup as
# "Renderer order: render.N = <name>" so machine-specific bindings are explicit.
render.5: Ctrl+Alt+m
render.6: Ctrl+Alt+l
capture_1: Ctrl+1
capture_2: Ctrl+2
capture_3: Ctrl+3
capture_4: Ctrl+4
video_conversion_off: v
video_conversion_p010: V

# Optional exact display-rate overrides, keyed by nominal input refresh rate.
# An active override is marked with * in the OSD.
[display_refresh_rate_override]
#23: 23.976024
#29: 29.970030
#59: 59.940060
#23: AUTO

# Optional renderer-native shader effects. madVR selects HLSL files; Alpha
# selects mpv-style GLSL files. Automatic effects are checked from left to
# right; the first signal/rate match wins. A shortcut makes an effect manual.
# Effects sharing a shortcut form one selector, and each renderer applies only
# its compatible member. Each file is under Shaders beside VideoProcessor.exe.
[shaders]
enabled: true
rules: nls,nls_alpha,nls_protected,nls_protected_alpha,nls_off
default: none
#fallback_shader_model: ps_3_0

# Uppercase N means Shift+N; lowercase n has no Shift modifier.
[shaders.nls]
label: Nonlinear Stretch
shortcut: N
type: nls
stable_geometry_deadband_percent: 2
file: NLS.hlsl
stage: pre_resize
geometry: classic
strength: 1.0
curve: 2.0
quality: high
tolerance_percent: 5

[shaders.nls_alpha]
label: Nonlinear Stretch
shortcut: N
type: nls
stable_geometry_deadband_percent: 2
file: NLS.glsl
stage: pre_resize
geometry: classic
strength: 1.0
curve: 2.0
tolerance_percent: 5

# Optional protected-centre NLS variant. Shift+P selects it; Shift+N selects
# classic NLS. Both read the selected viewport's screen_aspect at runtime.
[shaders.nls_protected]
label: Nonlinear Stretch Protected
shortcut: P
type: nls
stable_geometry_deadband_percent: 2
file: NLS.hlsl
stage: pre_resize
geometry: protected
strength: 1.0
center_protection: 0.35
curve: 2.0
quality: high
tolerance_percent: 5

[shaders.nls_protected_alpha]
label: Nonlinear Stretch Protected
shortcut: P
type: nls
stable_geometry_deadband_percent: 2
file: NLS.glsl
stage: pre_resize
geometry: protected
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5

[shaders.nls_off]
label: NLS Off
shortcut: n
output_aspect_ratio: native
none: true

[general]
persist_profile_selection: true
event_action_delay_seconds: 5

# Input and scaling groups are optional. When omitted, they contribute no
# overrides and the built-in renderer inherits [vpvr.display] directly.

# F4 clears only the display group's manual selection.
[profile_groups.display]
profiles: rec709,bt2020
default: auto
when: $key=="F4"

[profile_groups.viewport]
profiles: normal,scope
default: normal

[profiles.display.rec709]
when: $key=="F5" || $key=="Ctrl+F10"
sdr_target_primaries: REC709
report_bt2020_to_display: false

[profiles.display.bt2020]
when: $key=="F6" || $key=="Ctrl+F9"
sdr_target_primaries: BT2020
report_bt2020_to_display: true

[profiles.viewport.normal]
when: $key=="F3" || $key=="Ctrl+F10"
# screen_aspect defaults to 16:9 when omitted.

[profiles.viewport.scope]
when: $key=="F2" || $key=="Ctrl+F9"
screen_aspect: 2.35:1
subtitle_fit: true
subtitle_hold_seconds: 2
subtitle_padding_pixels: 30

# Completed refresh actions are optional and run only after a successful
# applied, confirmed, or restored transition.
#
#[event_actions]
#actions: refresh_24
#
#[event_actions.refresh_24]
#on: refresh.applied,refresh.confirmed
#when: $actual_refresh==23.976 || $actual_refresh==24
#program: C:\Videoprocessor\audio\audio_delay.bat
#arguments: 315

# Built-in renderer settings are grouped after all shared application,
# profile, viewport, shader, and event-action sections.
[vpvr.display]
sdr_target_nits: 100
sdr_black_nits: 0
quality: high
tone_mapping: spline
gamut_mapping: perceptual
peak_detection: AUTO
contrast_recovery: AUTO
upscaler: AUTO
downscaler: AUTO
deband: AUTO
dithering: AUTO
output_presentation: DIRECT
output_range: FULL
output_gamma: AUTO
sdr_target_primaries: REC709
report_bt2020_to_display: false
sdr_input_transfer: AUTO

[vpvr.general]
switch_refresh_rate: true
output_diagnostics: OFF
diagnostic_disable_shader_cache: OFF
