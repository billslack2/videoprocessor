# VideoProcessor release sample configuration
#
# This file is read at startup from the same directory as VideoProcessor.exe.
# Leave a setting commented out unless it is appropriate for your hardware.

[general]
# Select capture device and renderer in the UI, or uncomment either setting
# below and replace the value with an exact locally available name.
#capture_device: <capture device name>
#renderer: VideoProcessor Renderer (Alpha)
# Hide legacy DirectShow renderer registrations from the Windows system folders.
hide_legacy_renderers: true
#fullscreen: true
#windowed_fullscreen_mode: true
#fullscreen_monitor_name: <Windows monitor friendly name>
#fullscreen_monitor_session_mode: target-only
scene_detect: true
hdr_colorspace: FOLLOW_INPUT_LLDV
hdr_luminance: FOLLOW_INPUT_LLDV

# Press l for this normal-latency baseline. Press L for the low-latency mode.
# A one-frame queue is intentionally opt-in because it has less timing headroom.
[queue]
when: ${key}=="l"
queue_size: 32
lead_frames: 4
target_frames: 3
#active_picture_lookahead_frames: 0

[queue.low_latency]
when: ${key}=="L"
queue_size: 1
target_frames: 1

[queue_recovery]
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 70

[directshow]
video_conversion: V210_TO_P010
renderer_start_stop_time_method: RATIONAL_RATIONAL
frame_offset: 90
renderer_nominal_range: AUTO

[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 2

[directshow.ppm]
ppm: AUTO

[lldv]
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

[logging]
#debug_log_retention: 10

# VideoProcessor Renderer (Alpha) baseline. AUTO retains the selected quality
# preset's resolver value. Output range and calibration choices must match the
# actual display path; do not use another system's calibrated values blindly.
[vprenderer]
sdr_target_nits: 100
sdr_black_nits: 0
quality: high
tone_mapping: AUTO
gamut_mapping: AUTO
peak_detection: AUTO
contrast_recovery: AUTO
upscaler: AUTO
downscaler: AUTO
deband: AUTO
dithering: AUTO
output_presentation: AUTO
output_range: AUTO
output_gamma: AUTO
sdr_input_transfer: AUTO
sdr_target_primaries: REC709
report_bt2020_to_display: false
switch_refresh_rate: true

# F4 returns to the Rec.709 baseline. F5 selects SDR BT.2020 output only when
# the connected display and its calibration path are configured for it.
[vprenderer.rec709]
when: ${key}=="F4"
sdr_target_primaries: REC709
report_bt2020_to_display: false

[vprenderer.bt2020]
when: ${key}=="F5"
sdr_target_primaries: BT2020
report_bt2020_to_display: true

# The empty root uses VP Renderer's current output-panel aspect. DirectShow NLS
# needs a named viewport with screen_aspect because madVR owns display geometry.
# See CONFIGURATION.html for CIH, anamorphic, crop, and subtitle-fit examples.
[vprenderer.viewport]

# NLS is off by default. Press Shift+N for Classic, Shift+P for Protected,
# or n to return to the off state. Both bundled shader implementations must
# remain in the executable's shaders directory.
[shader.nls]
when: ${key}=="n"

[shader.nls.standard]
when: ${key}=="Shift+n"
shader_type: nls
label: Nonlinear Stretch
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: classic
strength: 1.0
curve: 2.0
tolerance_percent: 5
max_stretch_ratio: 1.4

[shader.nls.protected]
when: ${key}=="Shift+p"
shader_type: nls
label: Nonlinear Stretch Protected
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: protected
max_stretch_ratio: 1.4
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5
