# PPM Correction Configuration File
# Format: refresh_rate=ppm_value
# 
# IMPORTANT: Use the TRUNCATED refresh rate as the key (first two digits before decimal)!
# Examples:
#   59.94 Hz (NTSC) ? truncate to 59 ? use key "59"
#   29.97 Hz (NTSC) ? truncate to 29 ? use key "29"
#   23.976 Hz (cinema) ? truncate to 23 ? use key "23"
#
# Positive PPM values make the stream faster (reduces frame repeats/clock running slow)
# Negative PPM values make the stream slower (reduces drops/clock running fast)
# Zero PPM value means no correction
#
# Matching priority: 
# 1. TRUNCATED match (59 for 59.94) - PRIMARY
# 2. Tolerance match (±0.5 Hz) - FALLBACK
#
# Examples:
# 59=5     # Make 59.94 Hz (truncate to 59) 5 PPM faster
# 29=5     # Make 29.97 Hz (truncate to 29) 5 PPM faster
# 50=5     # Make 50 Hz 5 PPM faster
# 23=0     # No correction for 23.976 Hz (cinema, truncate to 23)

59=5
