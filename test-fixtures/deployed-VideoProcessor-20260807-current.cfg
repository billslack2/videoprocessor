# VideoProcessor.cfg — VP-0079 single-file configuration
#
# The root section is the baseline. A named child is an overlay selected by
# its when expression. Key selections last for this process only; they are
# cleared by selecting that root's when expression and never written to disk.

[general]
capture_device: Decklink Quad HDMI Recorder (2)
renderer: DirectShow - madVR
#renderer: VP Renderer
fullscreen: true
windowed_fullscreen_mode: true
fullscreen_monitor_name: EPSON PJ
# Disabled after VP-0095 topology-mode regression; retained for later retest: fullscreen_monitor_session_mode: target-only
fullscreen_monitor_session_mode: existing
startminimized: true
scene_detect: true
disable_detection_features: false
scene_correction_basic: false
hdr_colorspace: FOLLOW_INPUT_LLDV
hdr_luminance: FOLLOW_INPUT_LLDV

# Renderer aliases name the startup renderer-combo index. They make shortcuts
# portable across the configured renderer order without owning settings.
[renderer_alias]
vp: 1
madvr: 2

# l returns the queue to this baseline; L selects the low-latency overlay.
# A one-frame queue is intentionally opt-in because it will reset frequently
# if the renderer cannot keep up.
[queue]
when: ${key}=="l"
queue_size: 32
lead_frames: 4
target_frames: 3
active_picture_lookahead_frames: 2

[queue.low_latency]
when: ${key}=="L"
queue_size: 1
target_frames: 1

# Optional renderer-recovery safeguards; these retain the current defaults.
[queue_recovery]
#reset_after_render_restart_seconds: 5
#reset_queue_too_large_percent: 70

[shortcuts]
render.1: A
render.2: M

[directshow]
video_conversion: V210_TO_P010
renderer_start_stop_time_method: CLOCK_SMART2
frame_offset: 90
renderer_nominal_range: AUTO

[directshow.conversion]
conversion_method: SIMD
min_core_count: 1
max_core_count: 2

# One PPM correction applies to source timing at every cadence.
[directshow.ppm]
ppm: auto

[lldv]
#max_cll: 1000
#max_fall: 401
#mastering_min_luminance: 0.001
#mastering_max_luminance: 4000

[logging]
#debug_log_retention: 10

# VP Renderer only. The first section is the startup
# baseline. Later variants inherit it and override only their own values.
[vprenderer.rec709]
when: ${key}=="F5"
report_bt2020_to_display: false
sdr_target_nits: 100
sdr_black_nits: 0
quality: high
tone_mapping: spline
gamut_mapping: perceptual
peak_detection: AUTO
contrast_recovery: AUTO
upscaler: AUTO
downscaler: AUTO
deband: AUTO
dithering: AUTO
output_presentation: DIRECT
output_range: FULL
output_gamma: AUTO
sdr_input_transfer: AUTO
sdr_target_primaries: REC709
switch_refresh_rate: true



[vprenderer.bt2020]
when: ${key}=="F6"
sdr_target_primaries: BT2020
report_bt2020_to_display: true

# Viewport is VP Renderer-only. F3 is its empty 16:9 baseline; F2 selects scope.
[vprenderer.viewport]
when: ${key}=="F3"
screen_aspect: 16:9

[vprenderer.viewport.scope]
when: ${key}=="F2"
screen_aspect: 32:15
#2.35:1
automatic_crop: true
subtitle_fit: true
subtitle_hold_seconds: 2
subtitle_release_drift_ms: 2000
subtitle_padding_pixels: 30

# F8 enables the final VP Renderer-only 16:15 horizontal anamorphic correction.
# F2 returns to the regular Scope viewport without the correction.
[vprenderer.viewport.scope_anamorphic]
when: ${key}=="F8"
screen_aspect: 2.53:1
anamorphic_scale: 2:1
automatic_crop: true
subtitle_fit: true
subtitle_hold_seconds: 2
subtitle_release_drift_ms: 2000
subtitle_padding_pixels: 30

[shader.nls]
when: ${key}=="n"

[shader.nls.standard]
when: ${key}=="Shift+n"
shader_type: nls
label: Nonlinear Stretch
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: classic
strength: 1.0
curve: 1.5
tolerance_percent: 5

[shader.nls.protected]
when: ${key}=="Shift+p"
shader_type: nls
label: Nonlinear Stretch Protected
stage: pre_resize
order: 10
hlsl_file: NLS.hlsl
glsl_file: NLS.glsl
quality: high
geometry: protected
strength: 1.0
center_protection: 0.35
curve: 2.0
tolerance_percent: 5


# Use ${variable} everywhere an expression or action argument refers to state:
# when evaluates the value; run passes the same event-bound value to its command.
# These audio scripts deliberately keep their millisecond delay arguments literal.
[actions.audio_delay_film]
on: refresh.applied,refresh.confirmed
when: ${actual_refresh} <= 30
run: C:\Videoprocessor\audio\audio_delay.bat 100

[actions.audio_delay_video]
on: refresh.applied,refresh.confirmed
when: ${actual_refresh} >= 50
run: C:\Videoprocessor\audio\audio_delay.bat 65
